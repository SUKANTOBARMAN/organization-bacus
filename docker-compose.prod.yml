# প্রোডাকশন সার্ভারে: docker compose -f docker-compose.prod.yml up -d
# প্রয়োজন: একই ফোল্ডারে .env.prod (নিচে README দেখুন) এবং Caddyfile
services:
  app:
    image: ${IMAGE_PREFIX}-backend:latest
    restart: unless-stopped
    env_file: .env.prod
    environment:
      RUN_MIGRATIONS: "true"
    volumes:
      - storage_public:/var/www/html/storage/app/public
      - app_logs:/var/www/html/storage/logs
    depends_on:
      db:
        condition: service_healthy

  api:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - storage_public:/var/www/html/public/storage:ro
    depends_on:
      - app

  frontend:
    image: ${IMAGE_PREFIX}-frontend:latest
    restart: unless-stopped

  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
      API_DOMAIN: ${API_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - api
      - frontend

volumes:
  dbdata:
  storage_public:
  app_logs:
  caddy_data:
